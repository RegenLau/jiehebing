<!doctype html>
<html>
  <head>
    <title>结核病随访</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="结核病随访管理后台"
    />
    <link rel="shortcut icon" type="image/x-icon" href="/jhb-dev/app/admin/assets/favicon-D4tL44Sk.ico" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }

      html.dark {
        background-color: #070707;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
    <script type="module" crossorigin src="/jhb-dev/app/admin/assets/index-C8FRLPub.js"></script>
    <link rel="stylesheet" crossorigin href="/jhb-dev/app/admin/assets/index-CCPoHiPC.css">
  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
