user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    client_max_body_size 50m;
    sendfile        on;
    keepalive_timeout  65;

    gzip  on;
    gzip_min_length 1000;
    gzip_buffers 4 8k;
    gzip_types text/plain application/x-javascript text/css application/json application/xml text/javascript application/javascript;

    server {
        listen       80;
        server_name  _;

        root   /var/www;
        index  index.html index.htm;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location ^~ /api/ {
            proxy_pass https://api.qanydrugs.com/jhb-dev/;
            proxy_ssl_server_name on;
            proxy_set_header Host api.qanydrugs.com;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
